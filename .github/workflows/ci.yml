name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# v2.md §2: cada gate es un JOB independiente, de modo que SIEMPRE se obtenga el
# resultado de cada uno (aunque otro falle). El job final `gates` agrega todos y
# falla si cualquiera de los gates OBLIGATORIOS falló. Así un E2E rojo ya no oculta
# mutation/coverage/audit/static, y viceversa.
#
# Gates OBLIGATORIOS (rompen el build de CI si fallan):
#   build, test-dotnet, e2e, mutation, coverage-threshold, dependency-audit, static-analysis
# Gates INFORMATIVOS (no bloquean, sólo visibilidad):
#   npm-audit (se reporta, el gate de dependencias lo revisa pero no bloquea por npm)

jobs:
  build:
    name: Build (Release, warnings-as-errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DSLetreros.slnx
      - name: Build
        run: dotnet build DSLetreros.slnx -c Release --no-restore -warnaserror

  test-dotnet:
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DSLetreros.slnx
      - name: Build (no warnaserror, sólo para tests)
        run: dotnet build DSLetreros.slnx -c Release --no-restore
      - name: Test
        run: dotnet test DSLetreros.slnx -c Release --no-build --verbosity minimal

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build app
        run: dotnet build DSLetreros.slnx -c Release
      - name: npm ci + audit + install chromium
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run app (background)
        run: |
          ASPNETCORE_ENVIRONMENT=Development dotnet run -c Release --no-build --urls http://127.0.0.1:5107 &
          sleep 8
      - name: E2E
        working-directory: tests/e2e
        run: BASE_URL=http://127.0.0.1:5107 npx playwright test

  mutation:
    name: Mutation (Stryker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DSLetreros.slnx
      - name: Install Stryker (pinned)
        run: dotnet tool install -g dotnet-stryker --version 4.16.0
      - name: Mutation
        run: dotnet-stryker

  coverage:
    name: Coverage (cobertura + threshold)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DSLetreros.slnx
      - name: Cover
        run: dotnet test DSLetreros.slnx -c Release --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Coverage threshold gate
        run: |
          python3 - <<'PY'
          import os, glob, sys, xml.etree.ElementTree as ET
          files = glob.glob('coverage/**/coverage.cobertura.xml', recursive=True)
          if not files:
              print("No coverage.cobertura.xml found")
              sys.exit(1)
          path = files[0]
          root = ET.parse(path).getroot()
          lr = float(root.get('line-rate', '0'))
          br = float(root.get('branch-rate', '0'))
          print(f"line-rate={lr:.4f} branch-rate={br:.4f}")
          # Umbral mínimo de línea (defendible: la lógica de producción; ver MUTATION-JUSTIFICATION.md)
          threshold = 0.60
          if lr < threshold:
              print(f"FAIL: line-rate {lr:.4f} < {threshold}")
              sys.exit(1)
          print("PASS: coverage over threshold")
          PY

  dependency-audit:
    name: Dependency audit (dotnet vulnerable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DSLetreros.slnx
      - name: Vulnerable packages
        run: dotnet list package --vulnerable --include-transitive
      - name: npm audit (high/critical gate — RFLED §24)
        run: |
          cd tests/e2e && npm ci && npm audit --audit-level=high

  static-analysis:
    name: Static analysis (.NET analyzers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DSLetreros.slnx
      - name: Analyze
        run: dotnet build DSLetreros.slnx -c Release --no-restore -warnaserror /p:EnableNETAnalyzers=true

  # Agregación final: falla si CUALQUIERA de los gates obligatorios falló.
  gates:
    name: All mandatory gates
    runs-on: ubuntu-latest
    needs:
      - build
      - test-dotnet
      - e2e
      - mutation
      - coverage
      - dependency-audit
      - static-analysis
    if: always()
    steps:
      - name: Verify all mandatory gates passed
        run: |
          RESULT='${{ toJSON(needs) }}'
          echo "$RESULT"
          python3 - <<'PY'
          import json, sys
          needs = json.loads(r'''${{ toJSON(needs) }}''')
          ok = all(v.get('result') == 'success' for v in needs.values())
          if not ok:
              failed = [k for k, v in needs.items() if v.get('result') != 'success']
              print(f"FAIL: mandatory gates failed: {', '.join(failed)}")
              sys.exit(1)
          print("PASS: all mandatory gates green")
          PY