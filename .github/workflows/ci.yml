name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Restaurar + build Release con warnings tratados como errores (0 warnings).
      - name: Restore
        run: dotnet restore DSLetreros.slnx
      - name: Build (Release, warnings-as-errors)
        run: dotnet build DSLetreros.slnx -c Release --no-restore -warnaserror

      # Tests unitarios/domain/contract/aceptación
      - name: Test
        run: dotnet test DSLetreros.slnx -c Release --no-build --verbosity minimal

      # Node 24 (Playwright es compatible) + auditoría npm explícita.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm install (ci) + audit
        working-directory: tests/e2e
        run: |
          npm ci
          npm audit
          npx playwright install --with-deps chromium

      - name: Run app (background)
        run: |
          ASPNETCORE_ENVIRONMENT=Development dotnet run -c Release --no-build --urls http://127.0.0.1:5107 &
          sleep 8
      - name: E2E
        working-directory: tests/e2e
        run: BASE_URL=http://127.0.0.1:5107 npx playwright test

      # Mutation testing (Stryker) — VERSIÓN FIJA (no flotante).
      - name: Install Stryker (pinned)
        run: dotnet tool install -g dotnet-stryker --version 4.16.0
      - name: Mutation (Stryker)
        run: dotnet-stryker

      # Coverage report (cobertura) + auditoría de vulnerabilidades.
      - name: Coverage report
        run: dotnet test DSLetreros.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory coverage
      - name: Dependency audit
        run: dotnet list package --vulnerable --include-transitive

      # Análisis estático (analizadores .NET ya habilitados vía -warnaserror).
      - name: Static analysis
        run: dotnet build DSLetreros.slnx -c Release --no-restore -warnaserror /p:EnableNETAnalyzers=true